# CI/CD: em todo push e pull request roda lint, testes e build.
# Se for push na branch principal e tudo passar, pede um redeploy ao Dokploy
# e espera o resultado (o job fica vermelho se o build falhar lá).
#
# Para reaproveitar em outro projeto:
#   1. Copie este arquivo para .github/workflows/ do novo repositório.
#   2. Ajuste só os passos marcados com "PROJETO" no job ci.
#   3. Cadastre os secrets DOKPLOY_URL, DOKPLOY_API_KEY e DOKPLOY_COMPOSE_ID no repositório.
# O job deploy é igual em todos os projetos.
name: CI/CD

on:
  push:
    # Só branches; push de tag não dispara.
    branches: ['**']
  pull_request:

# O token automático do GitHub só pode ler o código.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior que ainda estiver rodando.
# Na branch principal, isso faz só o último push disparar o deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Impede o corepack de pedir confirmação antes de baixar o pnpm/yarn.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Baixa o código do commit que disparou o workflow.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Usa a versão do gerenciador fixada no campo packageManager do package.json.
      - run: corepack enable

      # PROJETO: instalação com o lockfile travado (falha se ele estiver desatualizado).
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # PROJETO: lint (biome ci confere lint, formatação e ordem dos imports).
      - name: Lint
        run: pnpm lint

      # Roda os testes só quando existir o script "test" no package.json.
      - name: Testes
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "Sem script test no package.json, pulando."
          fi

      # PROJETO: build. A API não compila nada, então o build é a imagem Docker,
      # a mesma que o Dokploy vai gerar (a imagem não é publicada em lugar nenhum).
      - name: Build da imagem Docker
        run: docker build --tag ${{ github.event.repository.name }}:ci .

  deploy:
    # Só roda se o job ci passou...
    needs: ci
    # ...e se for push (não pull request) na branch principal do repositório (main, master...).
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Inclui o tempo que o deploy pode passar na fila do Dokploy atrás de outro.
    timeout-minutes: 25
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
    steps:
      - name: Conferir secrets
        run: |
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_COMPOSE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name não cadastrado em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          # Tira a / do final da URL, se houver, para os próximos passos.
          echo "DOKPLOY_URL=${DOKPLOY_URL%/}" >> "$GITHUB_ENV"

      # Usa redeploy (e não deploy): o deploy troca o título pelo último commit do
      # repositório do compose; o redeploy mantém o título e reconstrói as imagens
      # com --build, buscando o código novo pelas URLs do Git. Ele não baixa de novo
      # o repositório do compose: mudanças no compose exigem um deploy normal.
      - name: Pedir redeploy ao Dokploy
        id: redeploy
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          # Passada por variável (e não direto no script) para que aspas ou
          # comandos na mensagem do commit não sejam executados pelo shell.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # O título aparece no histórico de deploys do Dokploy.
          title="$REPO_NAME@${GITHUB_SHA::7}"
          # Marca única desta execução, usada para achar este deploy no histórico.
          marker="[CI ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}]"
          description="${COMMIT_MESSAGE%%$'\n'*} $marker"

          # O jq monta o JSON escapando qualquer caractere especial.
          body=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "$title" \
            --arg description "$description" \
            '{composeId: $composeId, title: $title, description: $description}')

          # --fail-with-body: erro HTTP (token ou ID errado) deixa o job vermelho e mostra a resposta.
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$DOKPLOY_URL/api/compose.redeploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$body"
          echo

          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"

      # O redeploy não envia as notificações do Dokploy. Por isso o job espera o
      # resultado: se o build falhar, o job fica vermelho e o GitHub avisa por e-mail.
      - name: Aguardar o resultado do deploy
        env:
          TITLE: ${{ steps.redeploy.outputs.title }}
          MARKER: ${{ steps.redeploy.outputs.marker }}
        run: |
          deadline=$((SECONDS + 20 * 60))
          # Valor inicial diferente de qualquer status, para a primeira mensagem aparecer.
          last="inicio"

          while [ "$SECONDS" -lt "$deadline" ]; do
            # Lista os deploys do serviço (o mais recente primeiro).
            if ! response=$(curl --fail-with-body --silent --show-error --max-time 30 \
              --get "$DOKPLOY_URL/api/deployment.allByCompose" \
              --data-urlencode "composeId=$DOKPLOY_COMPOSE_ID" \
              --header "x-api-key: $DOKPLOY_API_KEY"); then
              echo "::warning::Falha ao consultar o Dokploy, tentando de novo."
              sleep 15
              continue
            fi

            # Status deste deploy; vazio enquanto ele ainda está na fila.
            status=$(jq -r --arg title "$TITLE" --arg marker "$MARKER" '
              if type != "array" then error("resposta inesperada do Dokploy") else
                first(.[] | select(.title == $title and ((.description // "") | endswith($marker))) | .status) // ""
              end' <<< "$response")

            if [ "$status" != "$last" ]; then
              case "$status" in
                "") echo "Na fila do Dokploy..." ;;
                running) echo "Build em andamento..." ;;
              esac
              last="$status"
            fi

            case "$status" in
              done)
                echo "Deploy concluído: $TITLE"
                exit 0 ;;
              error | cancelled)
                echo "::error::Deploy terminou com status '$status'. Veja o log na aba Deployments do serviço no Dokploy."
                exit 1 ;;
            esac

            sleep 15
          done

          echo "::error::O deploy não terminou em 20 minutos. Confira a aba Deployments do serviço no Dokploy."
          exit 1
